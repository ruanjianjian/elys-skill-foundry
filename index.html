<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#dce0e5" />
    <title>ELYS Skill Foundry · 让它干，你看结果。</title>
    <meta name="description" content="9 个技能，悬停看它开工，再按需安装。" />
    <meta property="og:title" content="ELYS Skill Foundry · SKILLS IN MOTION" />
    <meta
      property="og:description"
      content="少读说明，看它开工。9 个技能，9 支 12 秒短片。"
    />
    <meta
      property="og:url"
      content="https://ruanjianjian.github.io/elys-skill-foundry/"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://ruanjianjian.github.io/elys-skill-foundry/media/posters/ns-spec-cards.jpg"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141619'/%3E%3Cpath d='M13 43 24 21h7L20 43zm15 0 11-22h7L35 43z' fill='%23C1FF29'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css?v=20261017-cinematic-1" />
    <script type="module" src="app.js?v=20261017-cinematic-1"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到技能</a>
    <header class="topbar">
      <a class="brand" href="#top"><b aria-hidden="true">///</b> ELYS_SKILLS</a>
      <a class="style-link" href="?cut=cinematic#ns-spec-cards">新版试片 ↗</a>
      <div class="top-actions">
        <button
          id="bgm-toggle"
          type="button"
          aria-pressed="true"
          data-state="waiting"
        >
          节拍 · 点击播放</button
        ><button id="motion-toggle" type="button" aria-pressed="false">
          静态模式</button
        ><button id="copy-all" type="button">复制全部命令 ↗</button>
      </div>
    </header>
    <main id="top">
      <header class="page-heading">
        <h1>让它干，<span>你看结果。</span></h1>
        <p id="preview-hint">悬停预览 · 9 × 12 秒</p>
      </header>
      <section id="main" class="library" aria-label="9 个技能的动效预览">
        <div class="film-grid" id="skill-grid"></div>
      </section>
      <noscript
        ><p>
          请启用 JavaScript 浏览全部技能。也可打开
          <a href="media/films/ns-spec-cards.mp4">决策卡短片</a>、<a
            href="media/films/test-journal.mp4"
            >测试日志短片</a
          >，或查看
          <a
            href="https://github.com/ruanjianjian/elys-skill-foundry/tree/main/skills"
            >技能目录</a
          >。
        </p></noscript
      >
      <footer>
        <a
          href="https://github.com/ruanjianjian/elys-skill-foundry"
          target="_blank"
          rel="noopener noreferrer"
          >SOURCE ↗</a
        ><span>能力示意 · 原创图形与节拍</span
        ><button id="copy-share" type="button">复制群介绍 ↗</button>
      </footer>
    </main>
    <audio
      id="bgm"
      src="media/bgm.m4a"
      loop
      preload="none"
      aria-label="原创背景节拍"
    ></audio>
    <dialog id="copy-dialog" aria-labelledby="copy-title">
      <div class="dialog-heading">
        <h2 id="copy-title">复制这段内容</h2>
        <button class="close-dialog" type="button" aria-label="关闭复制内容">
          ×
        </button>
      </div>
      <p>请选中文字复制。</p>
      <textarea readonly id="copy-text" aria-label="待复制的内容"></textarea
      ><button class="close-dialog done" type="button">完成</button>
    </dialog>
    <dialog id="example-dialog" aria-labelledby="example-title">
      <div class="dialog-heading">
        <h2 id="example-title">实际页面示例</h2>
        <button class="close-dialog" type="button" aria-label="关闭页面示例">
          ×
        </button>
      </div>
      <div class="example-scroll"><img id="example-image" alt="" /></div>
      <p>实际页面样式 · 示例内容，不代表业务验收结果</p>
    </dialog>
    <div
      class="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      data-toast
    ></div>
  </body>
</html>
